name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist
          tar -czf "dist/agy-cli-patch-${{ matrix.asset_name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" agy-cli-patch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-cli-patch-${{ matrix.asset_name }}
          path: dist/agy-cli-patch-${{ matrix.asset_name }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum agy-cli-patch-*.tar.gz > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/agy-cli-patch-*.tar.gz
            artifacts/SHA256SUMS.txt
